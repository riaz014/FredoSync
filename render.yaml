# Render Blueprint for FredoSync Backend + Database
# https://render.com/docs/blueprint-spec

services:
  # Express.js Backend API
  - type: web
    name: fredosync-api
    env: node
    runtime: node
    buildCommand: npm install && npm run build:packages && npm run build --prefix apps/api
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: fredosync-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  # PostgreSQL Database
  - name: fredosync-db
    databaseName: fredosync
    user: fredosync
